      type: string
      enum: [本人选择, 熟人推荐, 既往就诊]
    CheckinChannel:
      type: string
      enum: [小程序, 前台]
    StaffType:
      type: string
      enum: [牙医, 其他人员]
    VerificationMethod:
      type: string
      enum: [visit_evidence, id_document]
      description: 现场核对既有就诊凭据 / 现场核对证件但不采集号码

    # ---- 身份 ----
    WechatLoginResult:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/WechatSession'
            - $ref: '#/components/schemas/WechatRegistration'
          discriminator:
            propertyName: kind
            mapping:
              session: '#/components/schemas/WechatSession'
              registration: '#/components/schemas/WechatRegistration'
    WechatSession:
      type: object
      additionalProperties: false
      required: [kind, session_token, expires_at]
      properties:
        kind:
          type: string
          enum: [session]
        session_token:
          type: string
          description: 服务端签发不透明令牌
        expires_at:
          type: string
          format: date-time
      description: 已绑定分支；additionalProperties:false 禁止混入 registration_token 等注册分支凭证字段。
    WechatRegistration:
      type: object
      additionalProperties: false
      required: [kind, registration_token, registration_expires_at]
      properties:
        kind:
          type: string
          enum: [registration]
        registration_token:
          type: string
          description: 短期注册上下文
        registration_expires_at:
          type: string
          format: date-time
      description: 未绑定分支；additionalProperties:false 禁止混入 session_token 等会话分支凭证字段。
    PatientSelfRegisterRequest:
      type: object
      additionalProperties: false
      required: [registration_token, name, phone, allergy_status]
      properties:
        registration_token:
          type: string
          description: 自助注册必须提供，消费后失效
        name:
          type: string
          maxLength: 60
        phone:
          type: string
          maxLength: 30
        birth_date:
          type: string
          format: date
          nullable: true
        allergy_status:
          $ref: '#/components/schemas/AllergyStatus'
        allergy_notes:
          type: string
          description: allergy_status 为 有/不确定 时必填
    StaffCreatePatientRequest:
      type: object
      additionalProperties: false
      required: [branch_id, name, phone, allergy_status, verification_method, verification_result, in_person]
      properties:
        branch_id: {type: string}
        name: {type: string, maxLength: 60}
        phone: {type: string, maxLength: 30}
        birth_date: {type: string, format: date, nullable: true}
        allergy_status: {$ref: '#/components/schemas/AllergyStatus'}
        allergy_notes: {type: string, maxLength: 1000, nullable: true}
        verification_method: {type: string, enum: [visit_evidence, id_document]}
        verification_result: {type: string, enum: [confirmed]}
        in_person: {type: boolean}
        duplicate_resolution: {type: string, enum: [shared_phone, same_name], nullable: true, description: 仅实际存在对应冲突时允许}
        source_channel: {type: string, enum: [现场, 电话, 转介绍, 微信小程序, 其他], nullable: true, description: 明确获知渠道；未采集不推断}
      description: 前台建档；不创建账号/微信；明文选择凭证只返回一次。
    PatientReceptionCreateResult:
      type: object
      required: [patient_id, branch_id]
      properties:
        patient_id: {type: string}
        branch_id: {type: string}
        selection_token: {type: string, description: 首次返回，明文仅一次}
        expires_at: {type: string, format: date-time}
        token_shown_once: {type: boolean}
        message: {type: string}
    PatientSelectionRequest:
      type: object
      additionalProperties: false
      required: [branch_id, name, phone, verification_method, verification_result, in_person, resolution]
      properties:
        branch_id: {type: string}
        name: {type: string, maxLength: 60}
        phone: {type: string, maxLength: 30}
        verification_method: {type: string, enum: [visit_evidence, id_document]}
        verification_result: {type: string, enum: [confirmed]}
        in_person: {type: boolean}
        resolution: {type: string, enum: [single_exact, manual_candidate, shared_phone, same_name], description: 服务端按实际精确/同电话/同名匹配计算，不接受客户端自报分类}
    PatientSelectionResult:
      type: object
      required: [selection_token, expires_at]
      properties:
        selection_token: {type: string}
        expires_at: {type: string, format: date-time}
    PatientSessionResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [session_token, patient_id]
          properties:
            session_token:
              type: string
            patient_id:
              type: string
            expires_at:
              type: string
              format: date-time
    BindingTokenIssueResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [binding_token, replayed, challenge_ref, expires_at, status]
          properties:
            binding_token:
              type: string
              nullable: true
              description: 首发明文；重放为 null
            replayed:
              type: boolean
            challenge_ref:
              type: string
              description: 凭证引用（UUID），用于重签 previous_challenge_ref
            expires_at:
              type: string
              format: date-time
            status:
              type: string
              enum: [active, consumed, revoked, expired, exhausted]
    Me:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [account_id, name, roles, must_change_password]
          properties:
            account_id:
              type: string
            name:
              type: string
            identity_type:
              type: string
              enum: [patient, staff]
            must_change_password:
              type: boolean
            roles:
              type: array
              items:
                type: object
                required: [role_code, branch_ids]
                properties:
                  role_code:
                    $ref: '#/components/schemas/RoleCode'
                  branch_ids:
                    type: array
                    items:
                      type: string
    PatientProfile:
      type: object
      required: [patient_id, name, phone, allergy_status, version]
      properties:
        patient_id:
          type: string
        name:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        phone:
          type: string
        email:
          type: string
          nullable: true
        emergency_name:
          type: string
          nullable: true
        emergency_phone:
          type: string
          nullable: true
        primary_dentist_id:
          type: string
          nullable: true
        allergy_status:
          $ref: '#/components/schemas/AllergyStatus'
        allergy_notes:
          type: string
          nullable: true
        version:
          type: integer

    # ---- 基础配置 ----
    BranchRequest:
      type: object
      additionalProperties: false
      required: [code, name, address, phone, license_no, opening_hours, manager_id]
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 300
        phone:
          type: string
          maxLength: 30
        license_no:
          type: string
          maxLength: 80
        license_valid_to:
          type: string
          format: date
        opening_hours:
          type: string
          maxLength: 200
        manager_id:
          type: string
          pattern: '^[1-9][0-9]*$'
      description: organization_id 由服务端按唯一经营主体确定；manager_id 首期必须等于当前创建者。
    BranchDetail:
      type: object
