        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UnavailabilityState'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 停诊记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DentistUnavailabilityPage'
    post:
      tags: [协调]
      operationId: staffCreateDentistUnavailability
      summary: 登记医生停诊
      description: 仅唯一组织负责人登记全局牙医停诊；事务提交后相交时段的新预约立即不可用。既有预约不自动取消、不释放占用、不视为已联系；逐患者协调另走正式流程。幂等键必填。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [doctor_id, starts_at, ends_at, reason]
              properties:
                doctor_id:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 300
      responses:
        '201':
          description: 已登记停诊
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    required: [absence_id, doctor_id, starts_at, ends_at, state]
                    properties:
                      absence_id: {type: string}
                      doctor_id: {type: string}
                      starts_at: {type: string, format: date-time}
                      ends_at: {type: string, format: date-time}
                      state: {type: string, enum: [有效, 已撤销]}
                  request_id: {type: string}

