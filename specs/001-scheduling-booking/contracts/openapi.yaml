      enum: [维护, 故障]
    ResourceUnavailableState:
      type: string
      enum: [有效, 已撤销]
    ResolveType:
      type: string
      enum: [误登记撤销, 已修复]
    ResourceUnavailabilityResult:
      type: object
      required: [data, request_id]
