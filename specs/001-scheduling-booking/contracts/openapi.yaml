        data:
          type: object
          required: [items, generated_at]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/DentistUnavailabilityItem'}
            generated_at: {type: string, format: date-time}
        request_id: {type: string}
    DentistUnavailabilityResult:
      type: object
      required: [data, request_id]
      properties:
        data: {$ref: '#/components/schemas/DentistUnavailabilityItem'}
        request_id: {type: string}
    ResourceKind:
