      tags: [基础配置与排班]
      operationId: staffUpdateBookingConfig
      summary: 设置签到窗口与步长
      description: 负责人；未配置时自助签到关闭。启用自助签到必须填写 early/late 分钟。乐观锁：branch_booking_config.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
