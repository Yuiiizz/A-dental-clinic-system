        '200':
          description: 同幂等键重放，返回原账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/accounts/{id}/role-scopes:
    get:
      tags: [身份与会话]
      operationId: staffGetRoleScopes
      summary: 读取员工账号角色与门店范围
      description: 仅有效且已完成强制改密的账号管理员可读；患者账号或不可见账号按404处理；version为account.auth_version的并发令牌，不是登录凭证。单事务读取版本与角色，二者来自同一快照。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 目标账号当前角色门店范围与并发版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRoleScopes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [身份与会话]
      operationId: staffSetRoleScopes
      summary: 设置角色与门店范围
      description: 管理员禁止自提权；角色×门店分别限定，不拼接；全量替换，同值重复无副作用；服务端递增 auth_version 并撤销会话。expected_version必填且必须等于读取到的account.auth_version；不匹配409且不写角色/会话/审计。改密或停用也会递增auth_version，因此旧版本需要重新读取。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, roles]
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                  description: 读取接口返回的 account.auth_version；不是登录凭证
                roles:
                  type: array
                  maxItems: 7
                  description: 禁止修改本人角色；空列表仅撤权；患者角色不可授予员工
                  items:
                    type: object
                    additionalProperties: false
                    required: [role_code, branch_ids, approval_basis]
                    properties:
                      role_code:
                        $ref: '#/components/schemas/RoleCode'
                      branch_ids:
                        type: array
                        maxItems: 100
                        uniqueItems: true
                        description: sysadmin须为空；其他角色逐门店核验有效任职
                        items:
                          type: string
                      approval_basis:
                        type: string
                        minLength: 1
                        maxLength: 300
      responses:
        '200':
          description: 已更新并撤销旧会话；返回权威当前版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRoleScopesUpdated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/accounts/{id}/disable:
    post:
      tags: [身份与会话]
      operationId: staffDisableAccount
      summary: 停用账号
      description: 最后管理员保护，停用并撤销会话。状态置位，重复停用幂等返回，属幂等例外；服务端递增 auth_version。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 已停用

