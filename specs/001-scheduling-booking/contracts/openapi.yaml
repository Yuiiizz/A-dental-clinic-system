            change_id:
              type: string
            state:
              $ref: '#/components/schemas/AppointmentChangeState'
    ChangeListResult:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items:
            type: object
            required: [change_id, original_id, proposed_id, state, version, candidate_state, applied]
            properties:
              change_id: {type: string}
              original_id: {type: string}
              proposed_id: {type: string}
              state:
                $ref: '#/components/schemas/AppointmentChangeState'
              version: {type: integer, minimum: 1}
              candidate_state: {type: string}
              applied: {type: boolean}
        request_id: {type: string}

    # ---- 排班 ----
    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [dentist_id, branch_id, starts_at, ends_at, service_type]
      properties:
        dentist_id:
          type: string
        branch_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        service_type:
          $ref: '#/components/schemas/ScheduleServiceType'
        travel_buffer_minutes:
          type: integer
          minimum: 0
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item_id, duration_minutes]
            properties:
              item_id:
                type: string
              duration_minutes:
                type: integer
                minimum: 1
    ScheduleResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [schedule_id, dentist_id, branch_id, starts_at, ends_at, state, version]
          properties:
            schedule_id:
              type: string
            dentist_id:
              type: string
            branch_id:
              type: string
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            state:
              $ref: '#/components/schemas/ScheduleState'
            version:
              type: integer
    SchedulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [schedule_id, dentist_id, branch_id, starts_at, ends_at, state]
            properties:
              schedule_id:
                type: string
              dentist_id:
                type: string
              branch_id:
                type: string
              starts_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
              state:
                $ref: '#/components/schemas/ScheduleState'
        next_cursor:
          type: string
          nullable: true

    # ---- 协调 ----
    PatientMatch:
      type: object
      required: [patient_id, display_name, phone_suffix, match_type]
      properties:
        patient_id: {type: string}
        display_name: {type: string, description: 脱敏姓名}
        phone_suffix: {type: string, description: 电话后四位}
        birth_year: {type: string, nullable: true}
        match_type: {type: string, enum: [exact_name_phone, same_phone, same_name]}
    ContactRequest:
      type: object
      additionalProperties: false
      required: [kind, channel, appointment_id, result]
      properties:
        kind:
          type: string
          enum: [人工联系]
        channel:
          type: string
          enum: [电话, 微信登记, 当面]
        appointment_id:
          type: string
        result:
          type: string
          maxLength: 300
        acknowledgment_basis:
          type: string
          maxLength: 300
        next_contact_at:
          type: string
          format: date-time
    ContactTodoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ContactTodo'}
        next_cursor: {type: string, nullable: true}
    ContactTodo:
      type: object
      required: [appointment_id, starts_at, last_contact_id, last_contacted_at, next_contact_at, acknowledged]
      properties:
        appointment_id: {type: string}
        starts_at: {type: string, format: date-time}
        last_contact_id: {type: string, nullable: true}
        last_contacted_at: {type: string, format: date-time, nullable: true}
        next_contact_at: {type: string, format: date-time, nullable: true}
        acknowledged: {type: boolean}
    ContactPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ManualContact'}
        next_cursor:
          type: string
          nullable: true
    ManualContact:
      type: object
      required: [contact_id, appointment_id, kind, channel, state, result, contacted_at, acknowledged, next_contact_at, staff_id]
      properties:
        contact_id: {type: string}
        appointment_id: {type: string}
        kind: {type: string, enum: [人工联系]}
        channel: {type: string, enum: [电话, 微信登记, 当面]}
        state: {type: string, enum: [已联系], description: 已登记人工尝试；是否真正知晓以 acknowledged 为准}
        result: {type: string, maxLength: 300}
        contacted_at: {type: string, format: date-time}
        acknowledged: {type: boolean}
        next_contact_at: {type: string, format: date-time, nullable: true}
        staff_id: {type: string}

    # ---- 签到 ----
    BranchBookingConfigResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [branch_id, configured, self_checkin_enabled, early_minutes, late_minutes, slot_step_minutes, version, updated_at]
          properties:
            branch_id: {type: string}
            configured: {type: boolean}
            self_checkin_enabled: {type: boolean}
            early_minutes: {type: integer, nullable: true, minimum: 0}
            late_minutes: {type: integer, nullable: true, minimum: 0}
            slot_step_minutes: {type: integer, minimum: 1}
            version: {type: integer, minimum: 1}
            updated_at: {type: string, format: date-time, nullable: true}
    QueueTicket:
      type: object
      required: [ticket_id, appointment_id, queue_date, queue_no, state, checkin_channel]
      properties:
        ticket_id:
          type: string
        appointment_id:
          type: string
        queue_date:
          type: string
          format: date
        queue_no:
          type: integer
        state:
          $ref: '#/components/schemas/QueueState'
        checkin_channel:
          $ref: '#/components/schemas/CheckinChannel'
    QueueTicketResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/QueueTicket'

    # ---- 政策 ----
    BookingPolicyRequest:
      type: object
      additionalProperties: false
      required: [branch_id, late_hours, window_days, event_limit, restriction_days]
      properties:
        branch_id:
          type: string
        late_hours:
          type: integer
          minimum: 0
        window_days:
          type: integer
          minimum: 1
        event_limit:
          type: integer
          minimum: 1
        restriction_days:
          type: integer
          minimum: 1
        restriction_enabled:
          type: boolean
          default: false
      description: version_no 由服务端按 UNIQUE(branch_id,version_no) 分配。
    BookingPolicyResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [policy_id, branch_id, version_no, status, restriction_enabled, version]
          properties:
            policy_id:
              type: string
            branch_id:
              type: string
            version_no:
              type: integer
            status:
              $ref: '#/components/schemas/BookingPolicyStatus'
            restriction_enabled:
              type: boolean
            effective_at:
              type: string
              format: date-time
            approved_by:
              type: string
              description: 服务端记录，客户端不可指定
            version:
              type: integer
    RestrictionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [restriction_id, branch_id, state, starts_at, ends_at, reason]
            properties:
              restriction_id:
                type: string
              branch_id:
                type: string
              policy_id:
                type: string
              state:
                $ref: '#/components/schemas/RestrictionState'
              starts_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
              reason:
                type: string
        next_cursor:
          type: string
          nullable: true
