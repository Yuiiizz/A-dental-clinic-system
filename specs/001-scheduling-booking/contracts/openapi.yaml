      tags: [基础配置与排班]
      operationId: staffSetServiceScope
      summary: 设置牙医可开展项目
      description: 目标按项目契约，当前尚未注册此路径，客户端不得调用；当前可用的整组配置路径见 /staff/scheduling/staff/{staffId}/services。后续需收敛为单一契约。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, verification_basis]
              properties:
                enabled:
                  type: boolean
                verification_basis:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 已更新

  /staff/scheduling/staff/{staffId}/services:
    put:
      tags: [基础配置与排班]
      operationId: staffReplaceDoctorServiceScope
      summary: 替换医生可开展项目集合（现行接口）
      description: 仅唯一组织负责人。必须填写实际核实依据；有项目仍用于未结束排班时拒绝移除并保持原集合。差异与依据同事务审计；同值请求无额外写入。医生范围不等于门店服务开放或可预约号源。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - in: path
          name: staffId
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_ids, approval_basis]
              properties:
                item_ids:
                  type: array
                  uniqueItems: true
                  items: {type: integer, format: int64, minimum: 1}
                approval_basis:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        '200': {description: 已保存当前范围}
        '409': {description: 移除项目仍关联未结束排班}
        '422': {description: 输入或依据无效}

  /staff/service-items:
