      type: string
      enum: [牙椅, 独立预约设备]
    ResourceOperatingState:
      type: string
      enum: [可用, 停用, 退役]
    QueueState:
      type: string
      enum: [候诊, 呼叫中, 过号, 已接诊, 已退出]
    FollowupPlanState:
      type: string
      enum: [待协调, 已预约, 已完成, 已终止]
    AppointmentChangeState:
      type: string
      enum: [待答复, 已同意, 已拒绝, 已撤回, 已落实]
