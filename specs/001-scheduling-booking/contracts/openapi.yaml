        仅唯一组织负责人。仅有效记录可解除；人工核实后写入 resolved_at/resolved_by（取当前会话）/resolve_basis。
        解除只更新停诊记录，不自动取消预约、不释放占用、不发送通知。幂等键必填；重复解除返回 409。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/UnavailableId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolve_basis]
              properties:
                resolve_basis:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 已解除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DentistUnavailabilityResult'
