        '200':
          description: 本店接待资料
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [patient_id, name, phone, appointments, visits]
                    properties:
                      patient_id: {type: string}
                      name: {type: string}
                      phone: {type: string}
                      appointments: {type: array, items: {type: object}}
                      visits: {type: array, items: {type: object}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 用户不存在或无本店预约}

  /staff/patients/{id}/selection:
    post:
      tags: [协调]
      operationId: staffSelectPatient
      summary: 线下核验后签发患者选择凭证
      description: 需要 patients.lookup；姓名+电话只用于重新定位，必须提交实际线下核验方式和 confirmed 结果；token 只返回一次。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSelectionRequest'
      responses:
        '200':
          description: 选择凭证，仅此次显示
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PatientSelectionResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/appointments/{id}/confirm:
    post:
      tags: [协调]
      operationId: staffConfirmAppointment
      summary: 落实待确认预约
      description: 待确认转已确认，同一确认服务；consent_basis 必填。乐观锁：appointment.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schedule_id, item_id, starts_at, policy_id, consent_basis, expected_version]
              properties:
                schedule_id:
                  type: string
                item_id:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                policy_id:
                  type: string
                consent_basis:
                  type: string
                  maxLength: 300
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResult'

  /staff/appointments/{id}/cancel:
    post:
      tags: [协调]
      operationId: staffCancelAppointment
      summary: 前台取消
      description: 前台核实发起方；诊所原因不计处罚。乐观锁：appointment.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, initiated_by, expected_version]
              properties:
                reason:
                  type: string
                  maxLength: 300
                initiated_by:
                  type: string
                  description: 发起方标识（patient/clinic/system）
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已取消

  /staff/appointments/{id}/changes:
    post:
      tags: [协调]
      operationId: staffCreateChangeProposal
      summary: 前台拟改约方案
      description: 候选待确认不占号；候选 previous_id 指向原预约。幂等键必填（防重复拟方案）。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate, reason]
              properties:
                candidate:
                  type: object
                  additionalProperties: false
                  required: [schedule_id, item_id, starts_at, policy_id]
                  properties:
                    schedule_id:
                      type: string
                    item_id:
                      type: string
                    starts_at:
                      type: string
                      format: date-time
                    policy_id:
                      type: string
                reason:
                  type: string
                  maxLength: 300
                absence_id:
                  type: string
                unavailable_id:
                  type: string
      responses:
        '201':
          description: 方案已拟
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalResult'

  /staff/changes:
    get:
      tags: [协调]
      operationId: staffListChanges
      summary: 查看本店协调方案
      description: 需本店代约权限及已核实任职；最近100条。
      security:
        - {StaffSessionCookie: []}
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 本店方案列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeListResult'

  /staff/changes/{id}/response:
    post:
      tags: [协调]
      operationId: staffRespondToChange
      summary: 前台登记患者答复
      description: 登记真实电话等答复，不默认同意。乐观锁：appointment_change.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept, confirmation_basis, expected_version]
              properties:
                accept:
                  type: boolean
                confirmation_basis:
                  type: string
                  maxLength: 300
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已登记答复

  /staff/changes/{id}/apply:
    post:
      tags: [协调]
      operationId: staffApplyChange
      summary: 落实改约方案
      description: 已同意才落实，冲突 409 并保留协调事实。乐观锁：appointment_change.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已落实
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/changes/{id}/withdraw:
    post:
      tags: [协调]
      operationId: staffWithdrawChange
      summary: 撤回未落实的协调方案
      description: 仅待答复或已同意的方案可撤回。撤回取消未占号的候选预约，保留原预约与已登记的患者答复；若患者已同意，前台须另行告知。用 expected_version 检查并发，同键重放返回当前权威视图。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/ChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        '200':
          description: 已撤回，返回当前方案视图
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/contacts:
    get:
      tags: [协调]
      operationId: staffListContacts
      summary: 人工联系历史列表
      description: 当前实现只返回当前授权门店的预约人工联系记录，按 contact_id 降序游标分页；尚无自动通知派发。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 联系待办分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
    post:
      tags: [协调]
      operationId: staffCreateContact
      summary: 登记联系记录
      description: 当前仅登记受有效停诊/资源禁用影响的预约人工联系尝试；只接受 kind=人工联系及电话/微信登记/当面渠道。未提供 acknowledgment_basis 时不表示患者知晓。幂等键必填；不自动改约、取消或发送系统通知。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data: {$ref: '#/components/schemas/ManualContact'}
                  request_id: {type: string}

  /staff/contacts/due:
    get:
      tags: [协调]
      operationId: staffListDueContacts
      summary: 受影响预约待联系清单
      description: 当前门店未来仍受有效停诊或资源禁用影响的活动预约；未联系、未确认知晓且未安排下次联系、或下次联系已到期时列出。只返回预约编号与时间、最近人工联系摘要；不表示系统通知已送达。按预约编号升序游标分页。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 待联系事项分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactTodoPage'

  /staff/branches/{id}/checkin-code:
    post:
      tags: [签到]
      operationId: staffCreateCheckinCode
      summary: 生成门店签到码
      description: 前台在本店营业且自助签到已启用时生成60秒有效的门店签名码，不含患者资料。同一幂等键重放返回原码；过期后须使用新键重新生成。生产环境未配置独立签名密钥时拒绝发码。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 签到码
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [code, expires_at]
                    properties:
                      code:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

  /staff/appointments/{id}/checkin:
    post:
      tags: [签到]
      operationId: staffCheckin
      summary: 前台签到
      description: 前台核实，异常时间须理由；取消、已改约、停诊不可直接强签。乐观锁：appointment.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, verification_basis]
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                verification_basis:
                  type: string
                  maxLength: 300
                exception_reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 候诊凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicketResult'

  /staff/queue:
    get:
      tags: [签到]
      operationId: staffGetQueue
      summary: 候诊队列
      description: 前台或本人牙医可见的候诊最小资料。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 候诊列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueTicket'

  /staff/appointments/{id}/no-show-review:
    post:
      tags: [政策]
      operationId: staffNoShowReview
      summary: 核实未到
      description: 结束且未签到才可核实未到。乐观锁：appointment.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expected_version]
              properties:
                reason:
                  type: string
                  maxLength: 300
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已核实

  /staff/booking-events/{id}/review:
    post:
      tags: [政策]
      operationId: staffReviewBookingEvent
      summary: 复核履约事件
      description: 前台本店复核，重算限制并审计。booking_event 无 version 列，用「幂等键 + 状态前置（仅待核实可复核）」保证。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [counted, reason]
              properties:
                counted:
                  type: boolean
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 已复核

  /staff/restrictions:
    get:
      tags: [政策]
      operationId: staffListRestrictions
      summary: 限制列表（员工视角）
      description: 前台处理申诉，不显示其他门店记录。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 限制分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionPage'

  /staff/booking-policies:
    post:
      tags: [政策]
      operationId: staffCreateBookingPolicy
      summary: 新建政策草稿
      description: 负责人草稿，默认不启用限制。幂等键必填。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPolicyRequest'
      responses:
        '201':
          description: 草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicyResult'

  /staff/booking-policies/{id}/publish:
    post:
      tags: [政策]
      operationId: staffPublishBookingPolicy
      summary: 批准发布政策
      description: 负责人批准，版本不可原地加重；approval_basis/effective_at 必填，approved_by/approved_at 由服务端记录。乐观锁：booking_policy.version 用 expected_version 校验。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approval_basis, effective_at, expected_version]
              properties:
                approval_basis:
                  type: string
                  maxLength: 300
                effective_at:
                  type: string
                  format: date-time
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicyResult'


  # ============ 现有真实业务扩展 ============
  /staff/internal-messages/contacts:
    get:
      tags: [店内沟通]
      operationId: staffInternalMessageContacts
      summary: 当前前台或医生可沟通的本店员工
      description: 仅返回同门店、有效任职和相应角色授权的已激活账号。owner 与 sysadmin 不自动获得消息权限。
      security: [{StaffSessionCookie: []}]
      responses:
        '200':
          description: 联系人列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/InternalContact'}
  /staff/internal-messages:
    get:
      tags: [店内沟通]
      operationId: staffInternalMessageList
      summary: 读取本店与指定员工的历史消息
      description: 服务端核验双方的门店角色与任职；仅返回指定会话，按消息编号分页。
      security: [{StaffSessionCookie: []}]
      parameters:
        - {name: branch_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: peer_staff_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 按时间正序显示的一页消息；cursor 用于读取更早消息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InternalMessagePage'}
    post:
      tags: [店内沟通]
      operationId: staffInternalMessageSend
      summary: 向本店前台或医生发送一条不可修改的工作消息
      description: 消息不触发改约、替诊、停诊、诊疗、收费等业务状态变更；网络结果不明时须用相同 Idempotency-Key 手动重试。
      security: [{StaffSessionCookie: [], StaffCsrf: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [branch_id, peer_staff_id, body]
              properties:
                branch_id: {type: integer, minimum: 1}
                peer_staff_id: {type: integer, minimum: 1}
                body: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201':
          description: 已保存消息，重放仍返回原消息
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/InternalMessage'}
  /staff/booking:
    get:
      tags: [基础配置与排班]
      operationId: staffBookingOverview
      summary: 前台预约工作台数据
      security:
        - {StaffSessionCookie: []}
      responses:
        '200':
          description: 门店、患者计数、牙医及助手排班、项目、已发布政策、availability 与预约。联系方式须逐人读取接待资料接口。
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    properties:
                      branches: {type: array, items: {type: object}}
                      patients:
                        type: array
                        description: 兼容旧客户端的空数组，不批量返回患者信息。
                        items: {type: object}
                      patient_count: {type: integer, minimum: 0}
                      schedules: {type: array, items: {type: object}}
                      assistant_shifts:
                        type: array
                        description: 仅授权门店未来的诊疗助手班次；不产生牙医号源或预约资格。
                        items:
                          type: object
                          required: [shift_id, branch_id, staff_id, name, job_title, starts_at, ends_at]
                          properties:
                            shift_id: {type: string}
                            branch_id: {type: string}
                            staff_id: {type: string}
                            name: {type: string}
                            job_title: {type: string}
                            starts_at: {type: string, format: date-time}
                            ends_at: {type: string, format: date-time}
                      services: {type: array, items: {type: object}}
                      policies:
                        type: array
                        description: 当前授权门店的已发布政策编号；供候选方案提交时核对，服务端仍重新验证。
                        items:
                          type: object
                          required: [policy_id, branch_id]
                          properties:
                            policy_id: {type: string}
                            branch_id: {type: string}
                      availability:
                        type: array
                        items: {$ref: '#/components/schemas/BookingAvailabilityItem'}
                      appointments:
                        type: array
                        items: {$ref: '#/components/schemas/BookingAppointment'}
                  request_id: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}


  /staff/visits:
    post:
      tags: [临床与治疗]
      operationId: staffVisitComplete
      summary: 完成就诊（需要 clinical.record，仅牙医角色默认获得）
      description: 关联复诊计划时，接诊医生必须提交 followup_goal_achieved 和非空临床记录；目标达到则计划完成，未达到则继续待协调。预约完成本身不能自动判定复诊目标。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appointment_id, allergy_result]
              properties:
                appointment_id: {type: string}
                allergy_result: {type: string, enum: [无已知, 有, 不确定]}
                allergy_snapshot: {type: string}
                clinical_notes: {type: string}
                followup_goal_achieved:
                  type: boolean
                  description: 仅关联复诊计划的预约必填；须由实际接诊医生按临床记录确认
      responses:
        '201': {description: 已写就诊记录}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 状态冲突}

  /staff/treatment-plans:
    get:
      tags: [临床与治疗]
      operationId: staffTreatmentPlanOverview
      summary: 治疗计划列表（需要 clinical.plan）
      security:
        - {StaffSessionCookie: []}
      responses:
        '200': {description: 计划列表}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [临床与治疗]
      operationId: staffTreatmentPlanCreate
      summary: 创建治疗计划草稿
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_visit_id, title, items]
              properties:
                source_visit_id: {type: string}
                title: {type: string}
                diagnosis: {type: string}
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, quantity, unit_price_cents]
                    properties:
                      service_item_id: {type: integer}
                      name: {type: string}
                      tooth_position: {type: string}
                      phase: {type: string}
                      quantity: {type: integer}
                      unit_price_cents: {type: integer}
      responses:
        '201': {description: 草稿}
        '403': {$ref: '#/components/responses/Forbidden'}

  /staff/treatment-plans/{id}/bill:
    post:
      tags: [收费与票据]
      operationId: staffTreatmentPlanBill
      summary: 从已接受治疗计划生成账单（一个计划最多一张）
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: 账单已创建}
        '409': {description: 重复建账或状态冲突}

  /staff/billing:
    get:
      tags: [收费与票据]
      operationId: staffBillingOverview
      summary: 收费工作台（需要 billing.manage）
      security:
        - {StaffSessionCookie: []}
      responses:
        '200': {description: 账单、收款、退款处理状态与票据}
        '403': {$ref: '#/components/responses/Forbidden'}

  /staff/invoices:
    post:
      tags: [收费与票据]
      operationId: staffInvoiceCreate
      summary: 票据申请（人工收据或人工登记的正式票据）
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bill_id, title]
              properties:
                bill_id: {type: string}
                title: {type: string}
                invoice_type: {type: string, enum: [人工收据, 增值税普通发票, 增值税专用发票]}
                buyer_type: {type: string, enum: [个人, 单位]}
                buyer_tax_no: {type: string}
                tax_treatment: {type: string, enum: [应税, 免税, 零税率, 不征税]}
                tax_rate_bps: {type: integer}
                net_amount_cents: {type: integer}
                tax_amount_cents: {type: integer}
      responses:
        '201': {description: 待开票申请}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/invoices/{id}/red:
    post:
      tags: [收费与票据]
      operationId: staffInvoiceRedRequest
      summary: 创建红冲申请；原票此时不变，完成红冲登记后才置已红冲
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: 红冲申请待开票}
        '409': {description: 已有活动红冲或原票状态不允许}

  /staff/invoices/{id}/issue:
    post:
      tags: [收费与票据]
      operationId: staffInvoiceIssue
      summary: 登记票据号；红冲票必须同时登记完成依据
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoice_no]
              properties:
                invoice_no: {type: string}
                basis: {type: string, description: 红冲完成依据，红冲票必填}
      responses:
        '200': {description: 已登记}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /me/records:
    get:
      tags: [患者自助]
      operationId: patientRecords
      summary: 本人就诊与复诊记录
      security:
        - {PatientBearer: []}
      responses:
        '200': {description: 记录}

  /me/treatment-plans:
    get:
      tags: [患者自助]
      operationId: patientTreatmentPlans
      summary: 本人治疗计划
      security:
        - {PatientBearer: []}
      responses:
        '200': {description: 计划}

  /me/treatment-plans/{id}/accept:
    post:
      tags: [患者自助]
      operationId: patientTreatmentPlanAccept
      summary: 患者接受治疗计划并记录依据
      security:
        - {PatientBearer: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                basis: {type: string}
      responses:
        '200': {description: 已接受}
        '404': {description: 非本人计划}


  /staff/clinical:
    get:
      tags: [临床与治疗]
      operationId: staffClinicalOverview
      summary: 就诊与复诊工作台
      description: 候诊和接诊中的 appointments 仅包含当前登录医生作为确认医生的预约；历史就诊与复诊计划仍按授权门店读取。plan_source_visits 只列当前医生本人完成的就诊，可用于创建复诊计划。开始及完成接诊另行校验实际医生身份。
      security:
        - {StaffSessionCookie: []}
      responses:
        '200': {description: 临床工作台}
        '403': {$ref: '#/components/responses/Forbidden'}

  /staff/followup-plans:
    get:
      tags: [临床与治疗]
      operationId: staffFollowupPlanList
      summary: 复诊计划
      security:
        - {StaffSessionCookie: []}
      responses:
        '200': {description: 复诊计划列表}
    post:
      tags: [临床与治疗]
      operationId: staffFollowupPlanCreate
      summary: 创建复诊计划
      description: 仅源就诊的实际接诊牙医本人可制定；可选指定该医生当前启用的可预约服务项目。未指定时允许后续从符合排班和时长的项目中选择。同次就诊已有待协调或已预约计划时返回 409 FOLLOWUP_PLAN_ALREADY_ACTIVE。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visit_id, suggested_from, suggested_to, duration_minutes, purpose]
              properties:
                visit_id: {type: string}
                suggested_from: {type: string, format: date}
                suggested_to: {type: string, format: date}
                duration_minutes: {type: integer}
                purpose: {type: string}
                service_item_id: {type: integer, format: int64, nullable: true, minimum: 1}
      responses:
        '201': {description: 已创建}
        '403': {description: 非源就诊实际接诊牙医或无门店临床权限}
        '409': {description: 源就诊已有待协调或已预约复诊计划}

  /staff/treatment-plans/{id}/submit:
    post:
      tags: [临床与治疗]
      operationId: staffTreatmentPlanSubmit
      summary: 提交患者确认
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 待患者确认}
        '409': {description: 状态冲突}

  /staff/treatment-plans/{id}/items/{itemId}/status:
    post:
      tags: [临床与治疗]
      operationId: staffTreatmentPlanItemStatus
      summary: 更新治疗项目进度
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: itemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [计划, 进行中, 已完成, 已取消]}
      responses:
        '200': {description: 已更新}
        '409': {description: 计划未接受}

  /staff/bills:
    post:
      tags: [收费与票据]
      operationId: staffBillCreate
      summary: 从已完成就诊创建账单
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visit_id, items]
              properties:
                visit_id: {type: string}
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, quantity, unit_price_cents]
                    properties:
                      name: {type: string}
                      quantity: {type: integer}
                      unit_price_cents: {type: integer}
      responses:
        '201': {description: 账单}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/bills/{id}/payments:
    post:
      tags: [收费与票据]
      operationId: staffBillPayment
      summary: 登记线下收款
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_cents, method]
              properties:
                amount_cents: {type: integer, minimum: 1}
                method: {type: string, enum: [现金, 银行卡, 微信线下登记, 其他线下]}
                note: {type: string}
      responses:
        '200': {description: 已登记收款}
        '409': {description: 账单已结清}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/refunds:
    post:
      tags: [收费与票据]
      operationId: staffRefundRequest
      summary: 提交退款申请（仅申请，不代表退款完成）
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bill_id, amount_cents, reason]
              properties:
                bill_id: {type: string}
                payment_id: {type: integer}
                amount_cents: {type: integer}
                reason: {type: string}
      responses:
        '201': {description: 待处理申请}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/refunds/{id}/process:
    post:
      tags: [收费与票据]
      operationId: staffRefundProcess
      summary: 财务登记线下退款完成或拒绝；需 billing.refund_process 权限
      description: 已退款必须以线下实际退款凭证为依据；本操作不调用支付渠道。处理后不可重复处理，发票更正独立办理。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, basis]
              properties:
                decision: {type: string, enum: [已退款, 已拒绝]}
                basis: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200': {description: 处理结果已登记}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 申请已经处理}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /staff/invoices/{id}/void:
    post:
      tags: [收费与票据]
      operationId: staffInvoiceVoid
      summary: 作废票据；活动红冲时拒绝
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200': {description: 已作废}
        '409': {description: 有活动红冲或已红冲}

  /me/billing:
    get:
      tags: [患者自助]
      operationId: patientBilling
      summary: 本人账单、收款、退款与票据
      security:
        - {PatientBearer: []}
      responses:
        '200': {description: 收费记录}

  /me/treatment-plans/{id}/reject:
    post:
      tags: [患者自助]
      operationId: patientTreatmentPlanReject
      summary: 患者拒绝治疗计划
      security:
        - {PatientBearer: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 已拒绝}
        '404': {description: 非本人计划}


  /me/booking:
    get:
      tags: [患者自助]
      operationId: patientBookingOverview
      summary: 患者真实可约数据
      description: 返回已发布排班、服务项目、本人预约和后端生成的 availability 候选时段。候选不代表预占，提交时服务端重新校验。
      security:
        - {PatientBearer: []}
      responses:
        '200':
          description: 排班、服务、availability、本人预约
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules: {type: array, items: {type: object}}
                  services: {type: array, items: {type: object}}
                  availability:
                    type: array
                    items: {$ref: '#/components/schemas/BookingAvailabilityItem'}
                  appointments:
                    type: array
                    items: {$ref: '#/components/schemas/BookingAppointment'}
        '401': {description: 未登录}

components:
  securitySchemes:
    PatientBearer:
      type: http
      scheme: bearer
      description: 服务端签发的不透明 Bearer，数据库仅存摘要；小程序端。
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: A_CLINIC_SESSION
      description: 员工 HttpOnly + Secure + SameSite=Lax 会话 Cookie，契约约定名 A_CLINIC_SESSION。
    StaffCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 员工状态变更的 CSRF 令牌，契约约定请求头 X-CSRF-Token。

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 分页游标
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: 客户端幂等键；作用域为账号＋操作＋键，operation_request 去重。
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 预约编号
    ScheduleId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 排班编号
    BranchIdQuery:
      name: branch_id
      in: query
      required: true
      schema:
        type: string
      description: 门店编号
    BranchId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 门店编号
    BranchPathId:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
      description: 任职门店编号（路径参数 branch_id）
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 员工编号
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
      description: 项目编号
    DoctorId:
      name: doctor_id
      in: path
      required: true
      schema:
        type: string
      description: 医生编号（路径参数 doctor_id）
    DoctorPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 医生编号（路径参数 id）
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 账号编号
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 患者编号
    ChangeId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 改约方案编号
    UnavailableId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 资源禁用编号
    RestrictionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 限制编号
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 履约事件编号
    PolicyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 政策版本编号

  responses:
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无操作权限或超出本人/门店范围（限制 403 附本人可见结束时刻与人工联系方式）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 不可见或不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 版本/资源/幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 字段、未知字段或业务前置不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 超过频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WechatExchangeFailed:
      description: 微信身份换取失败（code 无效/已用/超时/畸形响应），请重新获取登录凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WechatNotConfigured:
      description: 微信登录未配置（服务端缺 AppID/Secret），不会降级 mock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    StockItem:
      type: object
      required: [stock_item_id, code, name, kind, specification, base_unit, storage_condition, enabled]
      properties:
        stock_item_id: {type: string}
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [耗材]}
        specification: {type: string}
        base_unit: {type: string}
        storage_condition: {type: string}
        enabled: {type: boolean}
    StockItemCreate:
      type: object
      additionalProperties: false
      required: [code, name, specification, base_unit, storage_condition]
      properties:
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 1, maxLength: 120}
        specification: {type: string, minLength: 1, maxLength: 120}
        base_unit: {type: string, minLength: 1, maxLength: 20}
        storage_condition: {type: string, minLength: 1, maxLength: 200}
    StockItemPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StockItem'}}
        next_cursor: {type: string, nullable: true}
    StockItemResult:
      type: object
      required: [data, request_id]
      properties:
        data: {$ref: '#/components/schemas/StockItem'}
        request_id: {type: string}
    Warehouse:
      type: object
      required: [warehouse_id, branch_id, name, enabled]
      properties:
        warehouse_id: {type: string}
        branch_id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
    WarehouseCreate:
      type: object
      additionalProperties: false
      required: [branch_id, name]
      properties:
        branch_id: {type: string}
        name: {type: string, minLength: 1, maxLength: 80}
    WarehousePage:
      type: object
      required: [items, next_cursor]
      properties:
