              required: [self_checkin_enabled, slot_step_minutes, expected_version]
              properties:
                self_checkin_enabled:
                  type: boolean
                early_minutes:
                  type: integer
                  minimum: 0
                late_minutes:
                  type: integer
                  minimum: 0
                slot_step_minutes:
                  type: integer
                  minimum: 1
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchBookingConfigResult'
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/branches/{id}/opening-intervals:
    get:
      tags: [基础配置与排班]
      operationId: staffGetOpeningIntervals
      summary: 读取有界日期范围的营业区间
      description: 负责人；同一角色 branch.configure + 本店 scope + 有效已核实任职。from_date/to_date 两端包含，最多31个连续自然日；按 valid_on/starts_at 稳定排序。响应中的 version 与 intervals 来自同一数据库快照。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 日期范围内的营业区间与聚合版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningIntervalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags: [基础配置与排班]
      operationId: staffUpdateOpeningIntervals
      summary: 按日期范围替换营业区间
      description: |
        负责人；from_date/to_date 两端包含，最多31个连续自然日。日期按 Asia/Shanghai；from_date 不得早于今天。
        今天已开始的区间必须原样保留，只调整未开始区间；历史日期不可写。
        空 intervals 表示范围内闭店；范围外记录不变。branch.version 是该集合的聚合版本。
        缩短/删除导致未结束已发布班次或已确认/候诊中/接诊中预约失去完整覆盖时返回 409 影响摘要，零写入；待确认不占号、不参与覆盖校验；同值或扩大覆盖可成功。
        历史校验和“今天已开始区间”保护在取得 branch 锁后按同一 now 执行；已成功请求的幂等重放只返回当前权威视图，不重新执行写入或历史检查。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningIntervalReplaceRequest'
      responses:
        '200':
          description: 替换后的范围/版本/区间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningIntervalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本/历史/重叠冲突，或覆盖不足影响摘要
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpeningCoverageError'
                  - $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/accounts:
    get:
      tags: [身份与会话]
      operationId: staffListAccounts
      summary: 员工账号列表
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
