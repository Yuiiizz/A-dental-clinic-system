      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceItemRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItemResult'

  /staff/branches/{id}/services/{item_id}:
    put:
      tags: [基础配置与排班]
      operationId: staffSetBranchService
      summary: 设置门店服务开放与价格
      description: 同时维护初始/变动价格历史，不能只改快照。branch_service 无 version 列；调价追加价格历史行，故带 Idempotency-Key 防重试重复追加。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, auto_bookable, current_price, reason]
              properties:
                enabled:
                  type: boolean
                auto_bookable:
                  type: boolean
                current_price:
                  type: string
                  description: 数字字符串（numeric(12,2)），避免浮点误差
                reason:
