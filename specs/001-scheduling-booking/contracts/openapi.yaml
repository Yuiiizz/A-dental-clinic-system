        branch_name: {type: string}
        peer_staff_id: {type: string}
        peer_name: {type: string}
        actor_role: {type: string, enum: [frontdesk, dentist]}
    InternalMessage:
      type: object
      required: [message_id, sender_account_id, body, sent_at]
      properties:
        message_id: {type: string}
        sender_account_id: {type: string}
        body: {type: string, maxLength: 500}
        sent_at: {type: string, format: date-time}
    InternalMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InternalMessage'}}
        next_cursor: {type: string, nullable: true}
    BookingAvailabilityItem:
      type: object
      required: [schedule_id, item_id, slots]
      properties:
        schedule_id: {type: string}
        item_id: {type: string}
        duration_minutes:
          type: integer
          minimum: 1
          description: 患者预约候选所用的排班项目实际时长；复诊计划以此与计划时长比较
        slots:
          type: array
          description: 后端生成的候选项；不代表预占，提交仍可能冲突
          items: {type: string, format: date-time}
    BookingAppointment:
      type: object
      properties:
        appointment_id: {type: string}
        previous_id: {type: string, nullable: true}
        patient_id: {type: string}
        patient_name: {type: string}
        schedule_id: {type: string, nullable: true}
        dentist_name: {type: string}
        branch_id: {type: string}
        branch_name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        visit_type: {type: string}
        channel: {type: string}
        state: {type: string}
        coordination_state: {type: string, enum: [无需协调, 待协调, 已处理]}
        unavailability_alert: {type: boolean, description: 后端按有效停诊或该预约所占资源的有效禁用实时计算；true 表示需人工处理，不代表已通知患者}
        version: {type: integer}
        purpose: {type: string}
        item_name: {type: string}
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 业务错误码，如 POLICY_CHANGED、SLOT_UNAVAILABLE、IDEMPOTENCY_CONFLICT、ACCOUNT_EXISTS、NOT_ACTIVATED、VERSION_CONFLICT、UNKNOWN_FIELD、WECHAT_NOT_CONFIGURED、WECHAT_EXCHANGE_FAILED、REGISTRATION_TOKEN_INVALID、WECHAT_IDENTITY_ALREADY_BOUND、PATIENT_DUPLICATE_SUSPECTED、BINDING_TOKEN_INVALID、PATIENT_ALREADY_BOUND、PATIENT_ACCOUNT_DISABLED、BUSINESS_BASIS_REQUIRED、BINDING_TOKEN_ALREADY_ACTIVE、STALE_BINDING_REISSUE
        message:
          type: string
        request_id:
          type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
