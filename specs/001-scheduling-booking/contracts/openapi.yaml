                      items:
                        type: array
                        items:
                          type: object
                          required: [resource_id, name, resource_type, operating_state, branch_id, branch_name]
                          properties:
                            resource_id: {type: string}
                            name: {type: string}
                            resource_type: {type: string}
                            operating_state: {type: string}
                            branch_id: {type: string}
                            branch_name: {type: string}
                      branch_id: {type: string}
                      next_cursor: {type: string, nullable: true}
    post:
      tags: [基础配置与排班]
      operationId: staffCreateResource
      summary: 新增资源
      description: 负责人；禁止填写不存在的 asset_id。operating_state 由服务端默认「可用」。幂等键必填。
