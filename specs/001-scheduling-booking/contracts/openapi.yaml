        batch_id: {type: string}
        batch_no: {type: string}
        manufacturer: {type: string}
        expires_on: {type: string, format: date}
        batch_state: {type: string}
        stock_item_id: {type: string}
        code: {type: string}
        item_name: {type: string}
        base_unit: {type: string}
        quantity: {type: number}
    StockBalancePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StockBalance'}}
        next_cursor: {type: string, nullable: true}
    SupplierRow:
      type: object
      required: [supplier_id, name, credit_code, valid_to, enabled, verified_at]
      properties:
        supplier_id: {type: string}
        name: {type: string}
        credit_code: {type: string}
        valid_to: {type: string, format: date, nullable: true}
        enabled: {type: boolean}
        verified_at: {type: string, format: date-time}
    SupplierDetail:
      allOf:
        - $ref: '#/components/schemas/SupplierRow'
        - type: object
          required: [qualification_ref, verified_by]
          properties:
            qualification_ref: {type: string}
            verified_by: {type: string}
    InternalContact:
