              schema:
                $ref: '#/components/schemas/AccountPage'
    post:
      tags: [身份与会话]
      operationId: staffCreateAccount
      summary: 新建员工账号
      description: 系统管理员且已完成强制改密；目标须在岗且存在有效已核验 staff_branch 任职；创建待激活账号（无密码、不可登录），不自动授予角色。幂等键必填，同键同内容重放，同键不同内容或不同键重复 409。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
