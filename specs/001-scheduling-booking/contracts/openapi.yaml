        '200':
          description: 资源禁用记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnavailabilityPage'
    post:
      tags: [协调]
      operationId: staffCreateResourceUnavailability
      summary: 登记资源禁用
      description: 本店 branch.configure 负责人且任职已核验；kind=维护/故障。有效禁用自 starts_at 起持续阻止该资源新占用，预计 ends_at 不作为自动恢复依据。既有预约不自动取消或通知。幂等键必填。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resource_id, kind, starts_at, ends_at, reason]
              properties:
                resource_id:
                  type: string
                kind:
                  $ref: '#/components/schemas/ResourceKind'
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                  description: 预计结束，不代表自动恢复
                reason:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: 已登记禁用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnavailabilityResult'

  /staff/resource-unavailability/{id}/resolve:
    post:
      tags: [协调]
      operationId: staffResolveResourceUnavailability
      summary: 人工解除资源禁用
      description: |
        负责人；resolve_type=误登记撤销/已修复。人工核实后成组记录 resolved_by（取当前会话，不接受客户端传入，不得覆盖原登记人）/resolved_at/resolve_type/resolve_basis。
        解除本条后仍校验其他有效禁用记录，不因预计结束时间已过自动恢复。
        resource_unavailable 无 version 列，用「幂等键 + 状态前置（仅有效可解除）」保证。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/UnavailableId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolve_type, resolve_basis]
              properties:
                resolve_type:
                  $ref: '#/components/schemas/ResolveType'
                resolve_basis:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: 已解除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnavailabilityResult'
        '409':
          $ref: '#/components/responses/Conflict'

