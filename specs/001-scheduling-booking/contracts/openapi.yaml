        data:
          type: object
          required: [unavailable_id, resource_id, kind, starts_at, ends_at, state, resolved_at, resolve_type, resolved_by]
          properties:
            unavailable_id: {type: string}
            resource_name: {type: string}
            resource_type: {type: string}
            branch_id: {type: string}
            branch_name: {type: string}
            reason: {type: string}
            recorded_by: {type: string}
            recorded_at: {type: string, format: date-time}
            affected_count: {type: integer}
            affected_appointments:
              type: array
              items: {$ref: '#/components/schemas/AffectedAppointmentSummary'}
            resource_id: {type: string}
            kind: {$ref: '#/components/schemas/ResourceKind'}
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            state: {$ref: '#/components/schemas/ResourceUnavailableState'}
            resolved_at: {type: string, format: date-time, nullable: true}
            resolve_type: {type: string, nullable: true, enum: [误登记撤销, 已修复]}
            resolved_by: {type: string, nullable: true}
        request_id: {type: string}
    ResourceUnavailabilityItem:
      type: object
      required: [unavailable_id, resource_id, resource_name, resource_type, branch_id, branch_name, kind, starts_at, ends_at, reason, state, recorded_by, recorded_at, affected_count, affected_appointments]
      properties:
        unavailable_id: {type: string}
        resource_id: {type: string}
        resource_name: {type: string}
        resource_type: {$ref: '#/components/schemas/ResourceType'}
        branch_id: {type: string}
        branch_name: {type: string}
        kind: {$ref: '#/components/schemas/ResourceKind'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        reason: {type: string}
        state: {$ref: '#/components/schemas/ResourceUnavailableState'}
        recorded_by: {type: string}
        recorded_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        resolved_by: {type: string, nullable: true}
        resolve_type: {type: string, nullable: true, enum: [误登记撤销, 已修复]}
        resolve_basis: {type: string, nullable: true}
        affected_count: {type: integer}
        affected_appointments:
          type: array
          items: {$ref: '#/components/schemas/AffectedAppointmentSummary'}
