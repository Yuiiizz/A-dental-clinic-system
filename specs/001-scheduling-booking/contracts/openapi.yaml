      summary: 录入待核验资格
      description: 仅全局组织负责人；创建pending资格并追加submit历史，不授予角色/账号。幂等键必填。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
      responses:
        '201':
          description: 已录入pending资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetailResult'

  /staff/staff-members/{id}/credentials/{credential_id}/review:
    post:
      tags: [基础配置与排班]
      operationId: staffReviewCredential
      summary: 首次审核资格
      description: 仅pending→verified或pending→rejected；仅全局组织负责人；不提供撤销、重核或证件事实修改。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialReviewRequest'
      responses:
        '200':
          description: 审核后的资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetailResult'

  /staff/staff-members/{id}/credentials/{credential_id}/revoke:
    post:
      tags: [基础配置与排班]
      operationId: staffRevokeCredential
      summary: 撤销已核验资格
      description: 仅全局组织负责人，verified→rejected并追加revoke历史；保留原核验事实及已有预约占用。幂等重放返回当前资格视图，不重复写入。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRevokeRequest'
      responses:
        '200':
          description: 审核后的资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetailResult'

  /staff/staff-members/{id}/credentials/{credential_id}/reviews:
    get:
      tags: [基础配置与排班]
      operationId: staffListCredentialReviews
      summary: 资格审核历史
      description: 仅全局组织负责人；只读追加式历史，不返回证书原文；稳定review_id游标，默认20最大100。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 审核历史分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReviewPage'

  /staff/staff-members/{id}/credentials/{credential_id}/facts:
    get:
      tags: [基础配置与排班]
      operationId: staffGetCredentialFacts
      summary: 受控读取资格证件事实
      description: 仅唯一组织负责人可在实际核验前单条读取证书编号、类别、有效日期及当前状态；每次成功读取留不含证书编号的审计。列表和员工详情不返回证书编号；响应禁止缓存。读取本身不代表证件真实或资格审核通过。
      security:
        - {StaffSessionCookie: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 证件事实（Cache-Control no-store）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialFactsResult'

  /staff/staff-members/{id}/branches/{branch_id}:
    put:
      tags: [基础配置与排班]
      operationId: staffSetBranchAssignment
      summary: 设置员工门店任职
      description: 负责人；停用前列受影响班次。set 型 PUT，同值重复无副作用，属幂等例外（staff_branch 无 version 列，verified_at 由服务端记录）。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/BranchPathId'
      requestBody:
        required: true
        content:
