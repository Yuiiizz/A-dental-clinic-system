    DentistUnavailabilityItem:
      type: object
      required: [absence_id, doctor_id, doctor_name, starts_at, ends_at, reason, state, recorded_by, recorded_at, affected_count, affected_appointments]
      properties:
        absence_id: {type: string}
        doctor_id: {type: string}
        doctor_name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        reason: {type: string}
        state: {$ref: '#/components/schemas/UnavailabilityState'}
        recorded_by: {type: string}
        recorded_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        resolved_by: {type: string, nullable: true}
        resolve_basis: {type: string, nullable: true}
        affected_count: {type: integer}
        affected_appointments:
          type: array
          items: {$ref: '#/components/schemas/AffectedAppointmentSummary'}
    DentistUnavailabilityPage:
      type: object
