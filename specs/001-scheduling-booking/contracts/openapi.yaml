openapi: 3.0.3
info:
  title: A口腔诊所系统 — 第一阶段排班预约接口契约
  version: 0.1.0
  description: |
    包含已实现接口与规划接口；不得仅因列入契约就认定实现。具体差距参见 docs/design/appointment-contract-gap.md，所有示例为合成数据。
    - ID 一律以字符串传输（内部 bigint）；时间 RFC3339 且带时区（如 2026-11-01T09:00:00+08:00）；日期 YYYY-MM-DD。
    - 状态保留中文报告值（如 已确认），基础设施状态用英文（draft/published、pending/verified/rejected）。
    - 服务端计算字段（confirmed_dentist_id、ends_at、state、coordination_state、resource 分配、reviewed_by、resolved_by、resolved_at、approved_by、approved_at 等）只出现在响应，不接受客户端指定。
    - **未知请求字段一律拒绝**：所有请求体对象 `additionalProperties: false`，服务端对未声明字段返回 422。
    - **鉴权三分**：患者不透明 Bearer（服务端签发，仅存摘要）；员工 HttpOnly Cookie + CSRF 头；公开接口无鉴权。
    - **幂等与并发控制（逐接口声明）**：
      * 幂等键必填——新建/签发/生成类业务变更，带 `Idempotency-Key` 头（作用域 账号+操作+键，operation_request 去重）；
      * 幂等键 + `expected_version`——修改既有记录的乐观锁（目标表有 version 列，请求体带整数 `expected_version`）；
      * 合理例外——登录/登出/改密、单次消费凭证（注册/绑定）、天然幂等的 set 型 PUT/DELETE（同值重复无副作用）。
      * 目标表无 version 列的状态迁移（资源禁用解除、履约事件复核）用「幂等键 + 状态前置条件」保证，不带 expected_version。
    - 版本字段统一命名 `expected_version`。
    - 每笔预约单一 item_id；票据接口仅用于人工登记，不代表税控实际开票。
servers:
  - url: /api/v1
    description: 相对地址；前端与网关按部署环境拼接域名，数据库仅内网可达。
tags:
  - name: 身份与会话
  - name: 基础配置与排班
  - name: 公开查询与患者预约
  - name: 协调
  - name: 签到
  - name: 政策
  - name: 临床与治疗
  - name: 收费与票据
  - name: 患者自助
  - name: 店内沟通
  - name: 采购与供应商

paths:
  /staff/suppliers:
    get:
      tags: [采购与供应商]
      operationId: staffSupplierList
      summary: 读取已核验供应商档案
      description: 仅显式获得 suppliers.manage 的负责人或库管可见；返回最小列表，不含资质依据全文。
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 按 supplier_id 升序分页
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SupplierRow'}}
                  next_cursor: {type: string, nullable: true}
        '403': {description: 无供应商管理权限}
    post:
      tags: [采购与供应商]
      operationId: staffSupplierCreate
      summary: 人工核验后建立供应商档案
      description: 只建供应主体，不生成采购、入库或应付款；同键同内容重放返回当前档案。
      security: [{StaffSessionCookie: [], StaffCsrf: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, credit_code, qualification_ref, valid_to]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                credit_code: {type: string, minLength: 1, maxLength: 30}
                qualification_ref: {type: string, minLength: 1, maxLength: 300}
                valid_to: {type: string, format: date}
      responses:
        '201':
          description: 创建成功或同键重放
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SupplierDetail'}
        '403': {description: 无供应商管理权限}
        '409': {description: 主体标识已存在或幂等键内容冲突}
        '422': {description: 资质日期或字段无效}
  /staff/suppliers/{id}:
    get:
      tags: [采购与供应商]
      operationId: staffSupplierDetail
      summary: 读取供应商资质核验摘要
      security: [{StaffSessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 供应商详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SupplierDetail'}
        '404': {description: 供应商不存在}
  /staff/stock-items:
    get:
      tags: [采购与供应商]
      operationId: staffStockItemList
      summary: 按编码主档读取普通耗材
      description: 需库存读取权限和至少一个有效门店授权链；含启用与停用目录，不读取药品。
      security: [{StaffSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 按 stock_item_id 稳定分页, content: {application/json: {schema: {$ref: '#/components/schemas/StockItemPage'}}}}
        '403': {description: 无库存读取权限}
    post:
      tags: [采购与供应商]
      operationId: staffStockItemCreate
      summary: 建立普通耗材目录
      description: 仅建立耗材主档，不自动生成批次、库存或采购付款。
      security: [{StaffSessionCookie: [], StaffCsrf: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StockItemCreate'}}}}
      responses:
        '201': {description: 建档或同键重放, content: {application/json: {schema: {$ref: '#/components/schemas/StockItemResult'}}}}
        '403': {description: 无配置权限}
        '409': {description: 编码重复或幂等键冲突}
        '422': {description: 输入无效或未知字段}
  /staff/warehouses:
    get:
      tags: [采购与供应商]
      operationId: staffWarehouseList
      summary: 读取授权门店库位
      description: 只返回指定授权门店的库位，包含历史停用库位。
      security: [{StaffSessionCookie: []}]
      parameters:
        - {name: branch_id, in: query, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 按 warehouse_id 稳定分页, content: {application/json: {schema: {$ref: '#/components/schemas/WarehousePage'}}}}
        '403': {description: 无该门店读取权限}
    post:
      tags: [采购与供应商]
      operationId: staffWarehouseCreate
      summary: 建立本店库位
      description: 库位归属门店由请求指定，服务端核对同角色权限与有效任职。
      security: [{StaffSessionCookie: [], StaffCsrf: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WarehouseCreate'}}}}
      responses:
        '201': {description: 建档或同键重放, content: {application/json: {schema: {$ref: '#/components/schemas/WarehouseResult'}}}}
        '403': {description: 无该门店配置权限}
        '409': {description: 库位名称重复或幂等键冲突}
        '422': {description: 输入无效或未知字段}
  /staff/purchase-receipts:
    get:
      tags: [采购与供应商]
      operationId: staffPurchaseReceiptList
      summary: 读取本店已过账验收单
      description: 草稿与作废记录不对外展示，可按批次追溯所有已过账来源。
      security: [{StaffSessionCookie: []}]
      parameters:
        - {name: branch_id, in: query, required: true, schema: {type: string}}
        - {name: batch_id, in: query, required: false, schema: {type: string}, description: 按批次追溯来源}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 按 receipt_id 稳定分页，仅已过账, content: {application/json: {schema: {$ref: '#/components/schemas/ReceiptPage'}}}}
        '403': {description: 无该门店读取权限}
    post:
      tags: [采购与供应商]
      operationId: staffPurchaseReceiptPost
      summary: 人工核对并一次过账普通耗材验收
      description: 同事务写草稿、1–50 明细、正向流水后转已过账；不生成付款、应付款、税额或临床领用。重放只返回当前可见单据，不重复入库。
      security: [{StaffSessionCookie: [], StaffCsrf: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReceiptCreate'}}}}
      responses:
        '201': {description: 已过账或同键重放, content: {application/json: {schema: {$ref: '#/components/schemas/ReceiptResult'}}}}
        '403': {description: 无该门店验收入库权限}
        '409': {description: 资质、库位、批次、单号冲突或幂等键冲突}
        '422': {description: 数量、成本、日期或字段无效}
  /staff/purchase-receipts/{id}:
    get:
      tags: [采购与供应商]
      operationId: staffPurchaseReceiptDetail
      summary: 读取已过账验收单与明细
      description: 只显示本店已过账事实；不存在、未过账和无权目标统一 404。
      security: [{StaffSessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: 验收详情, content: {application/json: {schema: {$ref: '#/components/schemas/ReceiptResult'}}}}
        '404': {description: 不存在、未过账或不可访问}
  /staff/stock-balances:
    get:
      tags: [采购与供应商]
      operationId: staffStockBalanceList
      summary: 按已过账流水汇总本店批次账面余额
      description: 仅算已过账验收单；账面余额不代表临床可直接领用。以 batch_id 查询验收列表追溯所有来源。
      security: [{StaffSessionCookie: []}]
      parameters:
        - {name: branch_id, in: query, required: true, schema: {type: string}}
        - {name: warehouse_id, in: query, required: false, schema: {type: string}}
        - {name: stock_item_id, in: query, required: false, schema: {type: string}}
        - {name: batch_id, in: query, required: false, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 以 warehouse_id:batch_id 为游标分页, content: {application/json: {schema: {$ref: '#/components/schemas/StockBalancePage'}}}}
        '403': {description: 无该门店读取权限}
  /staff/appointments/{id}/start-visit:
    post:
      tags: [临床与治疗]
      operationId: staffStartVisit
      description: 由确认医生本人记录服务端实际开始时间，重复开始不重置时间。
      summary: 确认医生本人开始接诊，重复操作不重置时间
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 已开始接诊}
        '403': {description: 无权限或不是确认接诊医生}
        '409': {description: 当前状态不允许开始}

  # ============ 身份与会话 ============
  /auth/wechat:
    post:
      tags: [身份与会话]
      operationId: authWechatLogin
      summary: 微信登录（换身份）
      description: 仅接受 code，服务端换取 openid；已绑定返回业务会话，未绑定返回短期 registration_token。绝不信任客户端自报 openid。公开入口，code 单次使用，属幂等例外（不要求 Idempotency-Key）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: 微信登录临时 code，单次使用
      responses:
        '200':
          description: 会话分支或注册分支（二选一，见 discriminator）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatLoginResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/WechatExchangeFailed'
        '503':
          $ref: '#/components/responses/WechatNotConfigured'

  /auth/patient-register:
    post:
      tags: [身份与会话]
      operationId: authPatientRegister
      summary: 本人建档并建立账号
      description: 消费短期 registration_token，创建本人档案与账号。allergy_status 为 有/不确定 时 allergy_notes 必填。registration_token 单次消费，属幂等例外（重试返回「凭证已消费」而非重复建档）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSelfRegisterRequest'
      responses:
        '200':
          description: 返回业务会话及本人档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSessionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/patient-bind:
    post:
      tags: [身份与会话]
      operationId: authPatientBind
      summary: 核验并绑定旧档
      description: 消费 registration_token + 前台签发的一次性 binding_token，核验后原子绑定旧档（两个凭证单次消费、各最多5次失败）。属幂等例外。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [registration_token, binding_token]
              properties:
                registration_token:
                  type: string
                binding_token:
                  type: string
      responses:
        '200':
          description: 返回业务会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSessionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /staff/patients/{id}/binding-token:
    post:
      tags: [身份与会话]
      operationId: staffIssueBindingToken
      summary: 前台签发一次性绑定凭证
      description: |
        有本店业务范围的前台，在服务端门店权限下，以姓名+电话匹配档案并记录明确的线下本人核验
        （verification_method + in_person）后签发短期一次性凭证；仅该次响应显示明文。姓名+电话只匹配档案、
        不能证明本人。预约引用若提供须核对患者与门店。幂等键必填；同键同内容重放 binding_token=null 且
        replayed=true，只返回已签发元信息与当前状态。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [branch_id, patient_name, patient_phone, verification_method, in_person]
              properties:
                branch_id:
                  type: string
                patient_name:
                  type: string
                  maxLength: 60
                patient_phone:
                  type: string
                  maxLength: 30
                appointment_id:
                  type: string
                  description: 可选；须与该患者及该门店一致
                verification_method:
                  $ref: '#/components/schemas/VerificationMethod'
                in_person:
                  type: boolean
                  description: 前台确认本人到场，必须为 true
      responses:
        '200':
          description: 一次性绑定凭证（首发明文，重放不返回明文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingTokenIssueResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /staff/patients/{id}/binding-token/reissue:
    post:
      tags: [身份与会话]
      operationId: staffReissueBindingToken
      summary: 前台重签绑定凭证
      description: |
        显式重签：previous_challenge_ref 必填并须仍是当前待用凭证，患者锁内原子撤销旧凭证再签新凭证；
        过时引用 409，避免两名前台相互撤销刚签发的新凭证。已绑定患者拒绝首发/重签。幂等键必填；
        同键同内容重放 binding_token=null 且 replayed=true。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [branch_id, patient_name, patient_phone, verification_method, in_person, previous_challenge_ref]
              properties:
                branch_id:
                  type: string
                patient_name:
                  type: string
                  maxLength: 60
                patient_phone:
                  type: string
                  maxLength: 30
                appointment_id:
                  type: string
                  description: 可选；须与该患者及该门店一致
                verification_method:
                  $ref: '#/components/schemas/VerificationMethod'
                in_person:
                  type: boolean
                previous_challenge_ref:
                  type: string
                  description: 被重签凭证的 challenge_ref（UUID）
      responses:
        '200':
          description: 重签后的一次性绑定凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingTokenIssueResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/staff-login:
    post:
      tags: [身份与会话]
      operationId: authStaffLogin
      summary: 员工登录
      description: 登录，属幂等例外。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_name, password]
              properties:
                login_name:
                  type: string
                  maxLength: 100
                  description: 去首尾空白转小写后，匹配 [a-z0-9][a-z0-9._-]{2,99}
                password:
                  type: string
                  maxLength: 72
                  description: 不去空白或截断；最多72个UTF-8字节
      responses:
        '200':
          description: Cookie 会话及 CSRF 令牌
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [must_change_password, csrf_token]
                    properties:
                      must_change_password:
                        type: boolean
                      csrf_token:
                        type: string
                        description: 仅本次展示，供后续状态变更请求头使用
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password-change:
    post:
      tags: [身份与会话]
      operationId: authPasswordChange
      summary: 修改密码
      description: 撤销旧会话，返回新会话；不记录明文。会话撤销型，属幂等例外。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  maxLength: 72
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  description: 至少12个Unicode码点、最多72个UTF-8字节，不能与旧密码相同
      responses:
        '200':
          description: 新会话（Cookie）及 CSRF 令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrf_token:
                        type: string

  /auth/logout:
    post:
      tags: [身份与会话]
      operationId: authLogout
      summary: 退出登录
      description: 撤销当前会话，天然幂等，属幂等例外。患者 Bearer 或员工 Cookie。
      security:
        - {PatientBearer: []}
        - {StaffSessionCookie: [], StaffCsrf: []}
      responses:
        '204':
          description: 已撤销

  /auth/me:
    get:
      tags: [身份与会话]
      operationId: authMe
      summary: 当前会话本人信息
      description: 本人最小信息及各角色门店范围。
      security:
        - {PatientBearer: []}
        - {StaffSessionCookie: [], StaffCsrf: []}
      responses:
        '200':
          description: 本人信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'

  /me/profile:
    get:
      tags: [身份与会话]
      operationId: meGetProfile
      summary: 本人档案
      security:
        - {PatientBearer: []}
      responses:
        '200':
          description: 本人档案
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PatientProfile'
    post:
      tags: [身份与会话]
      operationId: meUpdateProfile
      summary: 修改本人资料（含过敏申报）
      description: 乐观锁：patient.version 用 expected_version 校验。未提供的联系方式沿用当前值；提供空字符串清空可选联系方式。allergy_status 为 有/不确定 时 allergy_notes 必填；改为其他状态时清空当前过敏说明。不修改历史接诊快照。同键重放返回当前权威档案。
      security:
        - {PatientBearer: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allergy_status, expected_version]
              properties:
                phone:
                  type: string
                  maxLength: 30
                email:
                  type: string
                  maxLength: 120
                emergency_name:
                  type: string
                  maxLength: 60
                emergency_phone:
                  type: string
                  maxLength: 30
                allergy_status:
                  $ref: '#/components/schemas/AllergyStatus'
                allergy_notes:
                  type: string
                  maxLength: 1000
                  description: 过敏或不确定时必填
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 更新后的档案
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PatientProfile'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============ 基础配置与排班 ============
  /staff/branches:
    get:
      tags: [基础配置与排班]
      operationId: staffListBranches
      summary: 门店列表
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 门店分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
    post:
      tags: [基础配置与排班]
      operationId: staffCreateBranch
      summary: 新增门店
      description: |
        唯一 organization 的负责人（responsible_staff_id）、owner 角色且具备 branches.create、员工在岗、已完成强制改密时创建
        state=草稿、version=1 的门店。organization_id 由服务端决定；manager_id 首期必须等于当前创建者。
        创建事务为目标 owner 角色建立本店 scope 和已核实 staff_branch，并递增 auth_version、撤销该账号会话；
        首次响应 reauthentication_required=true，客户端须重新登录。幂等键必填；重放不再次授 scope、不递增版本/不撤会话。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
      responses:
        '201':
          description: 已创建并返回权威门店详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/branches/{id}:
    get:
      tags: [基础配置与排班]
      operationId: staffGetBranch
      summary: 门店管理详情
      description: 具备本店 branch.configure、同一 role 的 branch scope 且 staff_branch 有效已核实的负责人可读；无权限目标与不存在统一404。详情不含营业区间、患者或财务信息。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: 门店档案与核验摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [基础配置与排班]
      operationId: staffUpdateBranch
      summary: 修改门店档案
      description: |
        负责人；只修改请求中出现的字段，缺省不修改，必填字段不可显式 null。
        营业状态仅允许名称/电话/营业说明/代码等普通字段；执业地址、许可证及有效期变更必须先停用。
        manager_id、organization_id、state、version、verified_by/verified_at、license_no_expiry_confirmed 不接受。
        许可事实变化自动清除核验标记和无期限确认；版本冲突零写入。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchPatchRequest'
      responses:
        '200':
          description: 已修改；返回当前状态和权威版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMutationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/branches/{id}/submit:
    post:
      tags: [基础配置与排班]
      operationId: staffSubmitBranch
      summary: 提交门店核验
      description: 草稿 → 待核验；负责人本店权限；Idempotency-Key + expected_version。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchVersionRequest'
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMutationResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/branches/{id}/verify:
    post:
      tags: [基础配置与排班]
      operationId: staffVerifyBranch
      summary: 核验门店并置为营业
      description: 待核验 → 营业；verification_basis 必填；许可证有效期未过期，或明确确认无期限。核验人和时间取当前会话/Clock，不接受客户端伪造。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchVerifyRequest'
      responses:
        '200':
          description: 已核验并营业
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMutationResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/branches/{id}/disable:
    post:
      tags: [基础配置与排班]
      operationId: staffDisableBranch
      summary: 停用门店
      description: 营业 → 停用；原因必填；存在未结束已发布班次或活动预约时 409 并返回精确影响摘要，不自动取消/改约。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchDisableRequest'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMutationResult'
        '409':
          description: 状态/版本冲突，或存在未结束排班/预约
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BranchImpactError'
                  - $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/branches/{id}/reopen:
    post:
      tags: [基础配置与排班]
      operationId: staffReopenBranch
      summary: 重新打开门店
      description: 停用 → 待核验；清除核验标记和无期限确认，不直接恢复营业、旧预约或排班。
      security:
        - {StaffSessionCookie: [], StaffCsrf: []}
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchVersionRequest'
      responses:
        '200':
          description: 已进入待核验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMutationResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'


  /staff/staff-members:
    get:
      tags: [基础配置与排班]
