      summary: 资源禁用记录与受影响预约摘要
      description: 目标门店 branch.configure 且任职已核验；仅返回该门店记录。摘要只含预约编号、时间、门店、项目和协调状态，不含患者姓名或联系方式。不自动取消、不释放占用、不表示已通知。
